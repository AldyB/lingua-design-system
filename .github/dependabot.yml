# Dependabot config for the lingua-design-system monorepo itself.
# Bumps internal devDeps (turbo, tsup, storybook, vitest, react) weekly.
# Consumer apps should use the template at docs/dependabot-template.yml.

version: 2
updates:
  # ── Root (turbo, changesets) ─────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "Europe/London"
    open-pull-requests-limit: 5
    groups:
      build-tools:
        patterns: ["turbo", "@changesets/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ── Tokens package (style-dictionary) ────────────────────────────────────
  - package-ecosystem: npm
    directory: "/packages/tokens"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  # ── React component package (storybook, vitest, etc.) ────────────────────
  - package-ecosystem: npm
    directory: "/packages/react"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      storybook:
        patterns: ["@storybook/*", "storybook"]
      testing:
        patterns: ["vitest", "@testing-library/*", "@vitejs/*", "jsdom"]
      types:
        patterns: ["@types/*"]

  # ── Docs site ────────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: "/apps/docs"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2

  # ── GitHub Actions versions ──────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
