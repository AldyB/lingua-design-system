name: Sync tokens → Figma Variables

on:
  push:
    branches: [main]
    paths:
      - "tokens/lingua-tokens.json"
      - "packages/tokens/scripts/figma-push.mjs"
  workflow_dispatch:

jobs:
  figma-push:
    name: Push variables to Figma
    runs-on: ubuntu-latest
    if: >
      vars.FIGMA_SYNC_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @lingua/tokens
        run: pnpm tokens:build

      # Always run dry-run first — safe, no secrets required, shows payload in logs
      - name: Dry run (payload summary)
        run: pnpm --filter @lingua/tokens figma:dry-run

      # Phase 7: use --update flag for non-destructive re-runs.
      # First push to a fresh file: remove --update. Subsequent runs: keep --update.
      - name: Push variables to Figma (idempotent update)
        if: >
          env.FIGMA_FILE_KEY != '' &&
          env.FIGMA_ACCESS_TOKEN != ''
        run: pnpm --filter @lingua/tokens figma:update
        env:
          FIGMA_FILE_KEY:     ${{ secrets.FIGMA_FILE_KEY }}
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
