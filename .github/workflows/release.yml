name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for Changesets to open release PRs and publish to GitHub Packages
permissions:
  contents:      write
  pull-requests: write
  packages:      write
  id-token:      write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release (Changesets)
    runs-on: ubuntu-latest

    # Phase 8 publishing is opt-in. Set repository variable RELEASE_ENABLED=true
    # (Settings → Variables → Actions) when packages are ready to publish.
    # Until then, this job no-ops on every push (won't fail CI).
    if: >
      vars.RELEASE_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@lingua'

      # Ensure pnpm sees the same registry + token that setup-node writes.
      # The scope token is what `pnpm publish` reads.
      - name: Configure pnpm auth for @lingua scope
        run: |
          echo "@lingua:registry=https://npm.pkg.github.com/" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      # ── Changesets: open release PR or publish ─────────────────────────────
      # If pending changesets exist:
      #   → opens/updates a "Version Packages" PR with the version bumps
      # If the previous release PR was just merged:
      #   → publishes the new versions to GitHub Packages
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit:  "chore: version packages"
          title:   "chore: version packages"
        env:
          GITHUB_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
