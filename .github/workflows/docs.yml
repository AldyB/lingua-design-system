name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Required for GitHub Pages OIDC deployment
permissions:
  contents: read
  pages:    write
  id-token: write

# Only one concurrent deployment; cancel in-flight runs on the same branch
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (tokens → Storybook → docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Step 1: Build all packages in dependency order (Turborepo)
      # @lingua/tokens → @lingua/icons → @lingua/react → @lingua/docs
      - name: Build all packages
        run: pnpm build
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      # Verify dist is up to date (same check as tokens.yml)
      - name: Assert token dist is not stale
        run: |
          git diff --exit-code packages/tokens/dist || \
            (echo "::error::packages/tokens/dist is stale. Commit the build output." && exit 1)

      # Step 2: Build Storybook static site (separate command since it's not
      # part of the standard `pnpm build` pipeline)
      - name: Build Storybook (@lingua/react)
        run: pnpm --filter @lingua/react build-storybook
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      # Step 3: Rebuild docs now that Storybook static is available
      # (docs build copies storybook-static/ into dist/storybook/)
      - name: Rebuild @lingua/docs with Storybook included
        run: pnpm --filter @lingua/docs build

      # Step 4: Upload the assembled dist/ to GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
