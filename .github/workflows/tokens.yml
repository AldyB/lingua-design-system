name: Token Pipeline

on:
  pull_request:
    paths:
      - "tokens/**"
      - "packages/tokens/**"

jobs:
  build-tokens:
    name: Build & diff tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm tokens:build

      - name: Fail if dist is stale
        run: |
          git diff --exit-code packages/tokens/dist || \
            (echo "::error::packages/tokens/dist is stale. Run 'pnpm tokens:build' and commit the result." && exit 1)
