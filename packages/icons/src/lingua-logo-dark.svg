<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <rect width="320" height="90" fill="#0F172A"/>

  <!-- Emerald tilde accent floating above the "L" -->
  <path d="M 14,20 Q 24,4 38,16 Q 52,28 66,14"
        stroke="#34D399" stroke-width="3.8" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "Lingua" wordmark — bold, white on dark -->
  <text x="16" y="72"
        font-family="'Helvetica Neue', Helvetica, 'Arial Black', Arial, sans-serif"
        font-size="58" font-weight="800"
        fill="#FFFFFF"
        letter-spacing="-1.5">Lingua</text>

  <!-- Subtle emerald dot -->
  <circle cx="302" cy="72" r="5" fill="#34D399"/>
</svg>
