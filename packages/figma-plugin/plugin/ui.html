<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0; padding: 16px;
    background: #fff; color: #0f172a;
    font-size: 13px;
  }
  h2 { margin: 0 0 4px; font-size: 15px; font-weight: 700; }
  p  { margin: 0 0 12px; color: #64748b; line-height: 1.5; }
  button {
    width: 100%; padding: 10px; border-radius: 8px; border: none;
    background: #4f46e5; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover   { opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #log {
    margin-top: 12px; padding: 10px; border-radius: 6px;
    background: #f8fafc; border: 1px solid #e2e8f0;
    font-size: 12px; color: #475569; max-height: 200px;
    overflow-y: auto; white-space: pre-line; display: none;
  }
  .done { color: #16a34a; font-weight: 600; }
  .warn { color: #b45309; }
  .err  { color: #dc2626; }
</style>
</head>
<body>
<h2>Lingua DS — Component Builder</h2>
<p>Creates all 21 design system components using Variables from Phase 5. Run this once on a fresh <strong>Lingua DS</strong> Figma file.</p>
<button id="btn" onclick="start()">⚡ Build all components</button>
<div id="log"></div>

<script>
  const btn = document.getElementById('btn');
  const log = document.getElementById('log');

  function start() {
    btn.disabled = true;
    btn.textContent = 'Building…';
    log.style.display = 'block';
    log.textContent = '';
    parent.postMessage({ pluginMessage: { type: 'build' } }, '*');
  }

  window.onmessage = event => {
    const msg = event.data.pluginMessage;
    if (!msg) return;

    if (msg.type === 'progress') {
      const cls = msg.ok ? '' : 'warn';
      log.innerHTML += `<span class="${cls}">${msg.text}\n</span>`;
      log.scrollTop = log.scrollHeight;
    }
    if (msg.type === 'done') {
      log.innerHTML += '<span class="done">\n✓ All components built!\n</span>';
      btn.textContent = '✓ Done — close this panel';
      btn.disabled = false;
      btn.style.background = '#16a34a';
      btn.onclick = () => parent.postMessage({ pluginMessage: { type: 'close' } }, '*');
    }
    if (msg.type === 'error') {
      log.innerHTML += `<span class="err">\n✗ Error: ${msg.text}\n</span>`;
      btn.disabled = false;
      btn.textContent = 'Retry';
    }
  };
</script>
</body>
</html>
