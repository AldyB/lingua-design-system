<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Token Explorer — Lingua Design System</title>
  <link rel="icon"       href="./lingua-logo-hero.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./lingua.light.css" />
  <link rel="stylesheet" href="./lingua.dark.css" />
  <link rel="stylesheet" href="./ds-styles.css" />

  <!-- React + Babel (CDN — Babel-in-browser "view source" artifact) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Token data: sets window.LDS (generated by docs build script) -->
  <script src="./tokens-export.js"></script>
</head>
<body>

<header class="ds-topbar">
  <a href="./index.html" style="display:flex;align-items:center;">
    <img src="./lingua-logo-light.svg" alt="Lingua" height="28" class="ds-logo-light" />
    <img src="./lingua-logo-dark.svg"  alt="Lingua" height="28" class="ds-logo-dark"  />
  </a>
  <nav>
    <a href="./index.html">Overview</a>
    <a href="./explorer.html" aria-current="page">Tokens</a>
    <a href="./components/">Components</a>
  </nav>
  <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
</header>

<div id="root"></div>

<!-- ds-components.jsx loaded as Babel transform -->
<script type="text/babel" src="./ds-components.jsx" data-presets="react"></script>

<script>
  const toggle  = document.getElementById('theme-toggle');
  const html    = document.documentElement;
  const stored  = localStorage.getItem('lingua-theme') || 'light';
  html.dataset.theme = stored;
  toggle.textContent  = stored === 'dark' ? '☀️' : '🌙';
  toggle.addEventListener('click', () => {
    const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
    html.dataset.theme  = next;
    toggle.textContent  = next === 'dark' ? '☀️' : '🌙';
    localStorage.setItem('lingua-theme', next);
  });
</script>

</body>
</html>
